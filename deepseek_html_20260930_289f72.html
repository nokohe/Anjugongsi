<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>项目合同资源中心 · 公司合同共享平台</title>
<style>
  :root{
    --primary:#2563eb;
    --primary-600:#1d4ed8;
    --primary-50:#eff6ff;
    --ink:#0f1c33;
    --text:#1e293b;
    --muted:#64748b;
    --line:#e2e8f0;
    --bg:#f5f7fb;
    --danger:#dc2626;
    --radius:14px;
    --shadow-sm:0 1px 2px rgba(15,28,51,.06), 0 1px 3px rgba(15,28,51,.04);
    --shadow:0 8px 28px rgba(15,28,51,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text);
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column; min-height:100%;
  }
  button{font-family:inherit}
  input,select,textarea{font-family:inherit}

  /* ---------- 顶部 ---------- */
  .site-header{
    background:linear-gradient(120deg,#0b1f3f 0%,#1e3a8a 48%,#2563eb 100%);
    color:#fff; padding:24px 0 62px; position:relative; overflow:hidden;
  }
  .site-header::after{
    content:""; position:absolute; right:-80px; top:-120px; width:340px; height:340px;
    background:radial-gradient(circle,rgba(255,255,255,.16),transparent 65%); border-radius:50%;
  }
  .container{max-width:1180px; margin:0 auto; padding:0 22px; width:100%}
  .header-inner{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; position:relative; z-index:1}
  .brand{display:flex; align-items:center; gap:14px}
  .brand-logo{
    width:46px; height:46px; border-radius:13px; flex-shrink:0;
    background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.25);
    display:grid; place-items:center; backdrop-filter:blur(6px);
  }
  .brand-logo svg{width:23px; height:23px; color:#fff}
  .brand h1{font-size:19px; font-weight:700; letter-spacing:.3px}
  .brand p{font-size:11.5px; opacity:.68; letter-spacing:1.2px; margin-top:3px; text-transform:uppercase}

  .btn{
    display:inline-flex; align-items:center; gap:7px; justify-content:center;
    padding:10px 18px; border-radius:10px; border:1px solid transparent;
    font-size:14px; font-weight:600; cursor:pointer; transition:.16s; white-space:nowrap;
  }
  .btn svg{width:16px; height:16px}
  .btn.ghost-light{
    background:rgba(255,255,255,.14); border-color:rgba(255,255,255,.3); color:#fff;
  }
  .btn.ghost-light:hover{background:rgba(255,255,255,.24)}
  .btn.primary{background:var(--primary); color:#fff; box-shadow:0 4px 14px rgba(37,99,235,.3)}
  .btn.primary:hover{background:var(--primary-600)}
  .btn.ghost{background:#fff; border-color:var(--line); color:var(--text)}
  .btn.ghost:hover{border-color:#c3cde0; background:#f8fafc}
  .btn.danger{background:var(--danger); color:#fff}
  .btn.danger:hover{background:#b91c1c}
  .btn:disabled{opacity:.6; cursor:not-allowed}

  /* ---------- 统计卡 ---------- */
  .stats{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr));
    gap:14px; margin-top:-42px; position:relative; z-index:2;
  }
  .stat{
    background:#fff; border-radius:var(--radius); padding:16px 18px;
    box-shadow:var(--shadow); display:flex; align-items:center; gap:13px;
    border:1px solid rgba(226,232,240,.9);
  }
  .stat .ico{
    width:42px; height:42px; border-radius:11px; flex-shrink:0;
    display:grid; place-items:center; background:var(--primary-50); color:var(--primary);
  }
  .stat .ico svg{width:20px; height:20px}
  .stat .num{font-size:21px; font-weight:750; letter-spacing:-.4px; line-height:1.15}
  .stat .lbl{font-size:12.5px; color:var(--muted); margin-top:3px}

  /* ---------- 上传区 ---------- */
  .section{margin-top:24px}
  .dropzone{
    background:#fff; border:2px dashed #cbd7ea; border-radius:16px;
    padding:32px 22px; text-align:center; cursor:pointer; transition:.18s;
    box-shadow:var(--shadow-sm);
  }
  .dropzone:hover,.dropzone.dragover{
    border-color:var(--primary); background:#f7faff;
    box-shadow:0 0 0 4px rgba(37,99,235,.08), var(--shadow);
  }
  .dz-icon{
    width:56px; height:56px; margin:0 auto 14px; border-radius:16px;
    background:var(--primary-50); color:var(--primary);
    display:grid; place-items:center; transition:.2s;
  }
  .dropzone:hover .dz-icon{transform:translateY(-2px)}
  .dz-icon svg{width:26px; height:26px}
  .dropzone h2{font-size:16px; font-weight:650; margin-bottom:6px}
  .dropzone p{font-size:13px; color:var(--muted)}

  /* ---------- 工具栏 ---------- */
  .panel{
    background:#fff; border-radius:16px; padding:18px;
    box-shadow:var(--shadow-sm); border:1px solid var(--line);
  }
  .toolbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px}
  .search{position:relative; flex:1; min-width:220px}
  .search input{
    width:100%; padding:10px 14px 10px 38px; border:1px solid var(--line);
    border-radius:10px; font-size:14px; background:#fff; outline:none; transition:.16s; color:var(--text);
  }
  .search input:focus{border-color:var(--primary); box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  .search svg{position:absolute; left:12px; top:50%; transform:translateY(-50%); width:16px; height:16px; color:var(--muted)}
  select{
    padding:10px 12px; border:1px solid var(--line); border-radius:10px;
    font-size:14px; background:#fff; outline:none; cursor:pointer; color:var(--text); transition:.16s;
  }
  select:focus{border-color:var(--primary); box-shadow:0 0 0 3px rgba(37,99,235,.12)}

  /* ---------- 列表 ---------- */
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px}
  .contract-card{
    border:1px solid var(--line); border-radius:var(--radius); padding:15px;
    display:flex; flex-direction:column; gap:12px; background:#fff;
    transition:box-shadow .18s, transform .18s, border-color .18s;
  }
  .contract-card:hover{box-shadow:var(--shadow); transform:translateY(-2px); border-color:#d3ddef}
  .card-head{display:flex; gap:12px; align-items:flex-start}
  .file-icon{
    width:42px; height:42px; border-radius:10px; flex-shrink:0;
    display:grid; place-items:center; color:#fff;
    font-size:10px; font-weight:800; letter-spacing:.4px;
  }
  .file-icon.pdf{background:#e5484d}
  .file-icon.doc{background:#2b6cb0}
  .file-icon.xls{background:#1f7a4d}
  .file-icon.img{background:#8b5cf6}
  .file-icon.zip{background:#b45309}
  .file-icon.other{background:#64748b}
  .card-title-wrap{min-width:0; flex:1}
  .card-title-wrap h3{
    font-size:14.5px; font-weight:650; line-height:1.4; margin-bottom:6px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
    word-break:break-all;
  }
  .tags{display:flex; gap:6px; flex-wrap:wrap}
  .tag{
    font-size:11px; padding:2.5px 8px; border-radius:6px; font-weight:600;
    background:var(--primary-50); color:var(--primary-600);
  }
  .tag.ghost{background:#f1f5f9; color:var(--muted); font-weight:500}
  .meta{display:flex; flex-direction:column; gap:6px; font-size:13px; padding-top:2px}
  .meta-row{display:flex; justify-content:space-between; gap:12px; align-items:baseline}
  .meta-row span{color:var(--muted); flex-shrink:0; font-size:12.5px}
  .meta-row b{
    font-weight:600; text-align:right; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; min-width:0;
  }
  .card-foot{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    border-top:1px solid #f1f5f9; padding-top:11px; margin-top:auto;
  }
  .file-info{font-size:11.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .actions{display:flex; gap:6px; flex-shrink:0}
  .act-btn{
    font-size:12.5px; padding:5px 10px; border-radius:8px; cursor:pointer;
    border:1px solid var(--line); background:#fff; color:var(--text); transition:.15s;
  }
  .act-btn:hover{border-color:var(--primary); color:var(--primary); background:var(--primary-50)}
  .act-btn.danger:hover{border-color:var(--danger); color:var(--danger); background:#fef2f2}

  .empty{
    grid-column:1/-1; text-align:center; padding:56px 20px; color:var(--muted);
  }
  .empty .emoji{font-size:40px; margin-bottom:12px}
  .empty h3{font-size:15.5px; color:var(--text); font-weight:650; margin-bottom:6px}
  .empty p{font-size:13px}

  /* ---------- 弹窗 ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(15,28,51,.5); backdrop-filter:blur(3px);
    display:none; align-items:center; justify-content:center; padding:20px; z-index:100;
  }
  .modal-overlay.show{display:flex; animation:fadeIn .16s ease}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .modal{
    background:#fff; border-radius:16px; width:min(620px,100%);
    max-height:90vh; display:flex; flex-direction:column; overflow:hidden;
    box-shadow:0 24px 60px rgba(15,28,51,.28); animation:popIn .2s cubic-bezier(.2,.9,.3,1.2);
  }
  @keyframes popIn{from{opacity:0; transform:scale(.96) translateY(8px)}to{opacity:1; transform:none}}
  .modal.small{width:min(400px,100%)}
  .modal.large{width:min(940px,96vw); height:min(84vh,780px)}
  .modal-head{
    padding:16px 20px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-shrink:0;
  }
  .modal-head h2{font-size:16px; font-weight:680}
  .icon-btn{
    width:30px; height:30px; border-radius:8px; border:none; background:transparent;
    color:var(--muted); cursor:pointer; font-size:16px; display:grid; place-items:center; transition:.15s;
  }
  .icon-btn:hover{background:#f1f5f9; color:var(--text)}
  .modal-body{padding:20px; overflow-y:auto; flex:1}
  .modal-foot{
    padding:14px 20px; border-top:1px solid var(--line); display:flex;
    justify-content:flex-end; gap:10px; flex-shrink:0; background:#fbfcfe;
  }

  .field{margin-bottom:16px}
  .field > label{display:block; font-size:13px; font-weight:620; margin-bottom:7px; color:#334155}
  .field input[type=text],.field input[type=date],.field input:not([type]),.field textarea,.field select{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px;
    font-size:14px; outline:none; transition:.16s; background:#fff; color:var(--text);
  }
  .field input:focus,.field textarea:focus,.field select:focus{
    border-color:var(--primary); box-shadow:0 0 0 3px rgba(37,99,235,.12);
  }
  .field textarea{resize:vertical; min-height:64px}
  .grid-2{display:grid; grid-template-columns:1fr 1fr; gap:0 14px}

  .pending-list{display:flex; flex-direction:column; gap:9px}
  .pending-item{
    display:flex; align-items:center; gap:10px; padding:9px 10px;
    background:#f8fafc; border:1px solid var(--line); border-radius:11px;
  }
  .pending-item .file-icon{width:34px; height:34px; font-size:9px; border-radius:8px}
  .pending-item input{
    border:1px solid transparent; background:transparent; padding:7px 9px;
    border-radius:8px; font-size:13px; outline:none; transition:.15s; min-width:0;
  }
  .pending-item input:hover{background:#fff; border-color:var(--line)}
  .pending-item input:focus{background:#fff; border-color:var(--primary); box-shadow:0 0 0 3px rgba(37,99,235,.1)}
  .p-name{flex:1}
  .p-amount{width:118px; flex-shrink:0; text-align:right}
  .remove-pending{
    width:26px; height:26px; border-radius:7px; border:none; background:transparent;
    color:var(--muted); cursor:pointer; font-size:14px; flex-shrink:0; transition:.15s;
  }
  .remove-pending:hover{background:#fee2e2; color:var(--danger)}

  .preview-frame{width:100%; height:100%; border:0; background:#525659; display:block}
  .preview-img{max-width:100%; max-height:100%; display:block; margin:auto; object-fit:contain}
  .preview-text{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:13px; white-space:pre-wrap; word-break:break-word; line-height:1.65;
  }
  .preview-none{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; height:100%; color:var(--muted); text-align:center}
  .preview-none .big{font-size:44px}
  .modal-body.flush{padding:0; display:flex; overflow:hidden}

  .confirm-icon{
    width:48px; height:48px; border-radius:50%; background:#fef2f2; color:var(--danger);
    display:grid; place-items:center; margin:0 auto 14px; font-size:22px; font-weight:800;
  }
  .confirm-msg{text-align:center; font-size:14px; line-height:1.6; color:var(--text)}

  /* ---------- Toast ---------- */
  #toast{
    position:fixed; left:50%; bottom:34px; transform:translate(-50%,18px);
    background:#0f1c33; color:#fff; padding:11px 20px; border-radius:10px;
    font-size:13.5px; font-weight:550; opacity:0; pointer-events:none;
    transition:.26s cubic-bezier(.2,.9,.3,1.1); z-index:200; box-shadow:0 10px 30px rgba(15,28,51,.3);
    max-width:86vw; text-align:center;
  }
  #toast.show{opacity:1; transform:translate(-50%,0)}

  footer{
    text-align:center; color:var(--muted); font-size:12.5px;
    padding:30px 20px 40px; margin-top:auto; line-height:1.8;
  }
  footer span{color:#94a3b8}

  @media (max-width:640px){
    .site-header{padding:18px 0 56px}
    .brand h1{font-size:17px}
    .brand p{display:none}
    .grid{grid-template-columns:1fr}
    .grid-2{grid-template-columns:1fr}
    .stats{grid-template-columns:repeat(2,1fr); gap:10px}
    .stat{padding:13px; gap:10px}
    .stat .ico{width:36px; height:36px}
    .stat .num{font-size:17px}
    .stat .lbl{font-size:11.5px}
    .dropzone{padding:26px 16px}
    .p-amount{width:86px}
    .container{padding:0 14px}
  }
</style>
</head>
<body>

<!-- ============ 顶部 ============ -->
<header class="site-header">
  <div class="container header-inner">
    <div class="brand">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
        </svg>
      </div>
      <div>
        <h1>项目合同资源中心</h1>
        <p>Project Contract Resource Center</p>
      </div>
    </div>
    <button class="btn ghost-light" id="exportBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      导出清单
    </button>
  </div>
</header>

<main class="container" style="flex:1">
  <!-- 统计 -->
  <section class="stats" id="stats"></section>

  <!-- 上传 -->
  <section class="section">
    <div class="dropzone" id="dropzone">
      <div class="dz-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
      </div>
      <h2>点击或拖拽文件到此处上传</h2>
      <p>支持 PDF / Word / Excel / 图片等格式，可批量上传多份合同</p>
      <input type="file" id="fileInput" multiple hidden />
    </div>
  </section>

  <!-- 合同列表 -->
  <section class="section panel">
    <div class="toolbar">
      <div class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="searchInput" placeholder="搜索合同名称、编号、签约单位…" />
      </div>
      <select id="catFilter"></select>
      <select id="sortSelect">
        <option value="newest">最新上传</option>
        <option value="oldest">最早上传</option>
        <option value="name">按名称排序</option>
        <option value="size">按大小排序</option>
      </select>
    </div>
    <div class="grid" id="grid"></div>
  </section>
</main>

<footer class="container">
  <div>项目合同资源中心 · 内部资料，请勿外传</div>
  <div><span>所有文件与信息均保存在本机浏览器中，不会上传到任何服务器</span></div>
</footer>

<!-- ============ 上传弹窗 ============ -->
<div class="modal-overlay" id="uploadModal">
  <div class="modal">
    <div class="modal-head">
      <h2>上传合同</h2>
      <button class="icon-btn" data-close>✕</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>待上传文件（可修改合同名称、填写金额）</label>
        <div class="pending-list" id="pendingList"></div>
      </div>
      <div class="grid-2">
        <div class="field">
          <label>合同类别</label>
          <select id="upCategory"></select>
        </div>
        <div class="field">
          <label>签约单位</label>
          <input type="text" id="upParty" placeholder="例如：XX建筑工程有限公司" />
        </div>
        <div class="field">
          <label>签订日期</label>
          <input type="date" id="upDate" />
        </div>
        <div class="field">
          <label>合同编号（选填）</label>
          <input type="text" id="upCode" placeholder="例如：HT-2024-018" />
        </div>
      </div>
      <div class="field" style="margin-bottom:0">
        <label>备注（选填）</label>
        <textarea id="upNote" rows="2" placeholder="补充说明，如付款节点、负责人等"></textarea>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn ghost" data-close>取消</button>
      <button class="btn primary" id="confirmUpload">确认上传</button>
    </div>
  </div>
</div>

<!-- ============ 预览弹窗 ============ -->
<div class="modal-overlay" id="previewModal">
  <div class="modal large">
    <div class="modal-head">
      <h2 id="previewTitle">文件预览</h2>
      <button class="icon-btn" data-close>✕</button>
    </div>
    <div class="modal-body flush" id="previewBody"></div>
  </div>
</div>

<script>
/* ============================================================
   配置
============================================================ */
const CATEGORIES = ['工程施工','设备采购','材料采购','技术服务','咨询服务','劳务分包','租赁合同','框架协议','其他'];
const DB_NAME = 'contract_hub_db';
const DB_VERSION = 1;
const STORE = 'contracts';

/* ============================================================
   状态
============================================================ */
let db = null;
const memStore = new Map();          // IndexedDB 不可用时的兜底
let contracts = [];
let pending = [];                    // 待上传文件
let previewUrl = null;
const view = { q:'', category:'all', sort:'newest' };

/* ============================================================
   工具函数
============================================================ */
const $ = s => document.querySelector(s);

function uid(){
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, m => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]
  ));
}
function getExt(name){
  const m = /\.([^.]+)$/.exec(name || '');
  return m ? m[1].toLowerCase() : '';
}
function iconClass(ext){
  if (ext === 'pdf') return 'pdf';
  if (['doc','docx','rtf','odt'].includes(ext)) return 'doc';
  if (['xls','xlsx','csv','ods'].includes(ext)) return 'xls';
  if (['png','jpg','jpeg','gif','webp','bmp','svg'].includes(ext)) return 'img';
  if (['zip','rar','7z','tar','gz'].includes(ext)) return 'zip';
  return 'other';
}
function formatSize(bytes){
  if (!bytes) return '0 B';
  const units = ['B','KB','MB','GB','TB'];
  let n = bytes, i = 0;
  while (n >= 1024 && i < units.length - 1) { n /= 1024; i++; }
  return (i === 0 ? n : n.toFixed(n >= 100 ? 0 : 1)) + ' ' + units[i];
}
function formatDate(ts){
  const d = new Date(ts);
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
function todayStr(){
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}

/* ============================================================
   IndexedDB 封装
============================================================ */
function openDB(){
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) return reject(new Error('浏览器不支持 IndexedDB'));
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = e => {
      const database = e.target.result;
      if (!database.objectStoreNames.contains(STORE)) {
        const store = database.createObjectStore(STORE, { keyPath: 'id' });
        store.createIndex('createdAt', 'createdAt', { unique: false });
      }
    };
    req.onsuccess = e => resolve(e.target.result);
    req.onerror = () => reject(req.error);
  });
}
function dbGetAll(){
  if (!db) return Promise.resolve([...memStore.values()]);
  return new Promise((res, rej) => {
    const r = db.transaction(STORE, 'readonly').objectStore(STORE).getAll();
    r.onsuccess = () => res(r.result || []);
    r.onerror = () => rej(r.error);
  });
}
function dbPut(rec){
  if (!db) { memStore.set(rec.id, rec); return Promise.resolve(); }
  return new Promise((res, rej) => {
    const r = db.transaction(STORE, 'readwrite').objectStore(STORE).put(rec);
    r.onsuccess = () => res();
    r.onerror = () => rej(r.error);
  });
}
function dbDelete(id){
  if (!db) { memStore.delete(id); return Promise.resolve(); }
  return new Promise((res, rej) => {
    const r = db.transaction(STORE, 'readwrite').objectStore(STORE).delete(id);
    r.onsuccess = () => res();
    r.onerror = () => rej(r.error);
  });
}

/* ============================================================
   提示 / 弹窗
============================================================ */
let toastTimer;
function toast(msg){
  let el = document.getElementById('toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}
function openModal(el){ el.classList.add('show'); document.body.style.overflow = 'hidden'; }
function closeModal(el){ el.classList.remove('show'); document.body.style.overflow = ''; }

function confirmDialog(msg){
  return new Promise(resolve => {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay show';
    overlay.innerHTML = `
      <div class="modal small">
        <div class="modal-body">
          <div class="confirm-icon">!</div>
          <p class="confirm-msg">${esc(msg)}</p>
        </div>
        <div class="modal-foot">
          <button class="btn ghost" data-r="0">取消</button>
          <button class="btn danger" data-r="1">确定删除</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.addEventListener('click', e => {
      e.stopPropagation();
      const b = e.target.closest('button[data-r]');
      if (b) { overlay.remove(); resolve(b.dataset.r === '1'); }
      else if (e.target === overlay) { overlay.remove(); resolve(false); }
    });
  });
}

/* ============================================================
   统计
============================================================ */
const STAT_ICONS = {
  total: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>',
  size:  '<path d="M22 12H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/><line x1="6" y1="16" x2="6.01" y2="16"/><line x1="10" y1="16" x2="10.01" y2="16"/>',
  month: '<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',
  party: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>'
};
function statCard(type, label, value){
  return `<div class="stat">
    <div class="ico">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">${STAT_ICONS[type]}</svg>
    </div>
    <div>
      <div class="num">${esc(value)}</div>
      <div class="lbl">${esc(label)}</div>
    </div>
  </div>`;
}
function renderStats(){
  const total = contracts.length;
  const size = contracts.reduce((a, c) => a + (c.size || 0), 0);
  const now = new Date();
  const month = contracts.filter(c => {
    const d = new Date(c.createdAt);
    return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
  }).length;
  const parties = new Set(contracts.map(c => c.party).filter(Boolean)).size;

  $('#stats').innerHTML = [
    statCard('total', '合同总数', total + ' 份'),
    statCard('size',  '存储容量', formatSize(size)),
    statCard('month', '本月新增', month + ' 份'),
    statCard('party', '合作单位', parties + ' 家')
  ].join('');
}

/* ============================================================
   筛选 & 渲染
============================================================ */
function applyFilters(){
  let list = contracts.slice();
  const q = view.q.trim().toLowerCase();
  if (q) {
    list = list.filter(c =>
      [c.name, c.party, c.code, c.note, c.category, c.fileName]
        .filter(Boolean)
        .some(v => String(v).toLowerCase().includes(q))
    );
  }
  if (view.category !== 'all') {
    list = list.filter(c => c.category === view.category);
  }
  switch (view.sort) {
    case 'oldest': list.sort((a, b) => a.createdAt - b.createdAt); break;
    case 'name':   list.sort((a, b) => String(a.name).localeCompare(String(b.name), 'zh')); break;
    case 'size':   list.sort((a, b) => (b.size || 0) - (a.size || 0)); break;
    default:       list.sort((a, b) => b.createdAt - a.createdAt);
  }
  return list;
}

function cardHTML(c){
  const ext = getExt(c.fileName);
  const cls = iconClass(ext);
  const label = (ext || 'file').slice(0, 4).toUpperCase();
  return `
  <article class="contract-card" data-id="${c.id}">
    <div class="card-head">
      <div class="file-icon ${cls}">${esc(label)}</div>
      <div class="card-title-wrap">
        <h3 title="${esc(c.name)}">${esc(c.name)}</h3>
        <div class="tags">
          <span class="tag">${esc(c.category || '未分类')}</span>
          ${c.code ? `<span class="tag ghost">${esc(c.code)}</span>` : ''}
        </div>
      </div>
    </div>
    <div class="meta">
      <div class="meta-row"><span>签约单位</span><b title="${esc(c.party || '')}">${esc(c.party || '—')}</b></div>
      <div class="meta-row"><span>合同金额</span><b>${c.amount ? '¥ ' + esc(c.amount) : '—'}</b></div>
      <div class="meta-row"><span>签订日期</span><b>${esc(c.signDate || '—')}</b></div>
    </div>
    <div class="card-foot">
      <span class="file-info">${formatSize(c.size)} · ${formatDate(c.createdAt)}</span>
      <div class="actions">
        <button class="act-btn" data-act="preview">预览</button>
        <button class="act-btn" data-act="download">下载</button>
        <button class="act-btn danger" data-act="delete">删除</button>
      </div>
    </div>
  </article>`;
}

function render(){
  renderStats();
  const list = applyFilters();
  const grid = $('#grid');

  if (!list.length) {
    grid.innerHTML = `
      <div class="empty">
        <div class="emoji">${contracts.length ? '🔍' : '📁'}</div>
        <h3>${contracts.length ? '没有找到匹配的合同' : '还没有上传任何合同'}</h3>
        <p>${contracts.length ? '试试调整搜索关键词或筛选条件' : '点击上方区域，上传第一份项目合同'}</p>
      </div>`;
    return;
  }
  grid.innerHTML = list.map(cardHTML).join('');
}

async function reload(){
  contracts = await dbGetAll();
  render();
}

/* ============================================================
   文件操作
============================================================ */
function downloadContract(c){
  const url = URL.createObjectURL(c.blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = c.fileName || c.name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}

function previewContract(c){
  const ext = getExt(c.fileName);
  const body = $('#previewBody');
  $('#previewTitle').textContent = c.name;

  if (previewUrl) { URL.revokeObjectURL(previewUrl); previewUrl = null; }
  body.innerHTML = '';

  if (ext === 'pdf') {
    previewUrl = URL.createObjectURL(c.blob);
    body.innerHTML = `<iframe class="preview-frame" src="${previewUrl}"></iframe>`;
  } else if (['png','jpg','jpeg','gif','webp','bmp','svg'].includes(ext)) {
    previewUrl = URL.createObjectURL(c.blob);
    body.innerHTML = `<img class="preview-img" src="${previewUrl}" alt="${esc(c.name)}" />`;
  } else if (['txt','md','csv','json','log'].includes(ext)) {
    const reader = new FileReader();
    reader.onload = () => {
      body.innerHTML = `<pre class="preview-text" style="padding:20px;overflow:auto;width:100%">${esc(reader.result)}</pre>`;
    };
    reader.readAsText(c.blob);
  } else {
    body.innerHTML = `
      <div class="preview-none">
        <div class="big">📄</div>
        <p>该文件格式暂不支持在线预览<br><span style="font-size:12px">${esc(c.fileName)}</span></p>
        <button class="btn primary" id="dlFromPreview">下载查看</button>
      </div>`;
    const btn = body.querySelector('#dlFromPreview');
    if (btn) btn.addEventListener('click', () => downloadContract(c));
  }
  openModal($('#previewModal'));
}

function closePreview(){
  if (previewUrl) { URL.revokeObjectURL(previewUrl); previewUrl = null; }
  $('#previewBody').innerHTML = '';
  closeModal($('#previewModal'));
}

/* ============================================================
   上传流程
============================================================ */
const dropzone = $('#dropzone');
const fileInput = $('#fileInput');

dropzone.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', e => {
  handleFiles([...e.target.files]);
  fileInput.value = '';
});

['dragenter','dragover'].forEach(ev =>
  dropzone.addEventListener(ev, e => {
    e.preventDefault(); e.stopPropagation();
    dropzone.classList.add('dragover');
  })
);
['dragleave','drop'].forEach(ev =>
  dropzone.addEventListener(ev, e => {
    e.preventDefault(); e.stopPropagation();
    dropzone.classList.remove('dragover');
  })
);
dropzone.addEventListener('drop', e => {
  const files = e.dataTransfer ? [...e.dataTransfer.files] : [];
  handleFiles(files);
});
// 阻止浏览器默认打开拖入的文件
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => e.preventDefault());

function handleFiles(files){
  const valid = files.filter(f => f && f.size >= 0);
  if (!valid.length) return;
  pending = valid.map(f => ({
    file: f,
    name: f.name.replace(/\.[^.]+$/, ''),
    amount: ''
  }));
  renderPending();
  $('#upDate').value = todayStr();
  openModal($('#uploadModal'));
}

function renderPending(){
  const wrap = $('#pendingList');
  wrap.innerHTML = pending.map((p, i) => {
    const ext = getExt(p.file.name);
    return `
      <div class="pending-item">
        <div class="file-icon ${iconClass(ext)}">${esc((ext || 'file').slice(0, 4).toUpperCase())}</div>
        <input class="p-name" data-i="${i}" value="${esc(p.name)}" placeholder="合同名称" />
        <input class="p-amount" data-i="${i}" value="${esc(p.amount)}" placeholder="金额" inputmode="decimal" />
        <button class="remove-pending" data-i="${i}" title="移除">✕</button>
      </div>`;
  }).join('');
}

$('#pendingList').addEventListener('input', e => {
  const el = e.target;
  const i = Number(el.dataset.i);
  if (Number.isNaN(i) || !pending[i]) return;
  if (el.classList.contains('p-name')) pending[i].name = el.value;
  if (el.classList.contains('p-amount')) pending[i].amount = el.value;
});

$('#pendingList').addEventListener('click', e => {
  const btn = e.target.closest('.remove-pending');
  if (!btn) return;
  const i = Number(btn.dataset.i);
  pending.splice(i, 1);
  if (!pending.length) { closeModal($('#uploadModal')); return; }
  renderPending();
});

function resetUploadForm(){
  pending = [];
  $('#pendingList').innerHTML = '';
  $('#upParty').value = '';
  $('#upCode').value = '';
  $('#upNote').value = '';
  $('#upDate').value = todayStr();
  $('#upCategory').selectedIndex = 0;
}

$('#confirmUpload').addEventListener('click', async () => {
  if (!pending.length) return;

  const btn = $('#confirmUpload');
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = '上传中…';

  const party = $('#upParty').value.trim();
  const category = $('#upCategory').value;
  const signDate = $('#upDate').value;
  const code = $('#upCode').value.trim();
  const note = $('#upNote').value.trim();

  try {
    for (const p of pending) {
      if (!p.name.trim()) p.name = p.file.name;
      const rec = {
        id: uid(),
        name: p.name.trim(),
        amount: p.amount.trim(),
        party, category, signDate, code, note,
        fileName: p.file.name,
        mime: p.file.type || 'application/octet-stream',
        size: p.file.size,
        blob: p.file,
        createdAt: Date.now()
      };
      await dbPut(rec);
    }
    const count = pending.length;
    closeModal($('#uploadModal'));
    resetUploadForm();
    await reload();
    toast(`已成功上传 ${count} 份合同`);
  } catch (err) {
    console.error(err);
    toast('上传失败：' + (err.message || '未知错误'));
  } finally {
    btn.disabled = false;
    btn.textContent = originalText;
  }
});

/* ============================================================
   列表交互
============================================================ */
$('#grid').addEventListener('click', async e => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const card = btn.closest('.contract-card');
  if (!card) return;
  const id = card.dataset.id;
  const c = contracts.find(x => x.id === id);
  if (!c) return;

  const act = btn.dataset.act;
  if (act === 'download') {
    downloadContract(c);
  } else if (act === 'preview') {
    previewContract(c);
  } else if (act === 'delete') {
    const ok = await confirmDialog(`确定要删除「${c.name}」吗？删除后无法恢复。`);
    if (!ok) return;
    await dbDelete(id);
    contracts = contracts.filter(x => x.id !== id);
    render();
    toast('已删除');
  }
});

/* ============================================================
   搜索 / 筛选
============================================================ */
let searchTimer;
$('#searchInput').addEventListener('input', e => {
  clearTimeout(searchTimer);
  const val = e.target.value;
  searchTimer = setTimeout(() => {
    view.q = val;
    render();
  }, 160);
});
$('#catFilter').addEventListener('change', e => {
  view.category = e.target.value;
  render();
});
$('#sortSelect').addEventListener('change', e => {
  view.sort = e.target.value;
  render();
});

/* ============================================================
   导出 CSV
============================================================ */
$('#exportBtn').addEventListener('click', () => {
  const list = applyFilters();
  if (!list.length) { toast('暂无可导出的合同'); return; }

  const rows = [['合同名称','合同编号','类别','签约单位','合同金额','签订日期','文件名','文件大小','上传时间','备注']];
  list.forEach(c => rows.push([
    c.name || '', c.code || '', c.category || '', c.party || '',
    c.amount || '', c.signDate || '', c.fileName || '',
    formatSize(c.size || 0), formatDate(c.createdAt), c.note || ''
  ]));

  const csv = rows
    .map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(','))
    .join('\r\n');

  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `合同清单_${todayStr()}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  toast(`已导出 ${list.length} 条记录`);
});

/* ============================================================
   全局弹窗关闭
============================================================ */
document.addEventListener('click', e => {
  const closeBtn = e.target.closest('[data-close]');
  if (closeBtn) {
    const overlay = closeBtn.closest('.modal-overlay');
    if (!overlay) return;
    if (overlay.id === 'previewModal') closePreview();
    else {
      closeModal(overlay);
      if (overlay.id === 'uploadModal') resetUploadForm();
    }
    return;
  }
  if (e.target.classList && e.target.classList.contains('modal-overlay')) {
    if (e.target.id === 'previewModal') closePreview();
    else if (e.target.id === 'uploadModal') { closeModal(e.target); resetUploadForm(); }
  }
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  document.querySelectorAll('.modal-overlay.show').forEach(m => {
    if (m.id === 'previewModal') closePreview();
    else if (m.id === 'uploadModal') { closeModal(m); resetUploadForm(); }
    else { m.classList.remove('show'); if (!m.id) m.remove(); }
  });
});

/* ============================================================
   初始化
============================================================ */
function initSelects(){
  const catOpts = CATEGORIES.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
  $('#upCategory').innerHTML = catOpts;
  $('#catFilter').innerHTML = `<option value="all">全部类别</option>` + catOpts;
}

(async function init(){
  initSelects();
  try {
    db = await openDB();
  } catch (err) {
    console.warn('IndexedDB 不可用，使用内存模式：', err);
    db = null;
    toast('浏览器存储不可用，本次数据不会保留');
  }
  await reload();
})();
</script>
